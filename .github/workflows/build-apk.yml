name: Build and Release Aura Invoice APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew || gradle wrapper --gradle-version 8.2

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          name: Aura Invoice ${{ github.ref_name }}
          body: |
            ## Aura Invoice Release
            - Native iOS-grade smooth transitions & Telegram UX.
            - Full offline capability via Service Worker.
            - Auto-generated release binary.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
